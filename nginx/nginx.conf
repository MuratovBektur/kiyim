events {}

http {
    upstream backend {
        server backend:3001;
    }

    upstream frontend {
        server frontend:3000;
    }

    # Rate/connection limits per client IP. "api" is stricter than "general"
    # because backend work is more expensive per request; "images" is looser
    # because a single product grid fires off dozens of parallel thumbnail
    # requests, which is normal traffic, not abuse.
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=images:10m rate=40r/s;
    # В dev-режиме (nuxt dev/Vite, local и dev compose-профили) один переход
    # по страницам отдаёт сотни отдельных запросов JS-модулей — в общий
    # лимит general (20 rps, burst 60) они не укладываются, часть падает с
    # 429, и клиентский Vue вообще не догружается: SSR-разметка есть, но ни
    # один @click во всём приложении не работает (не только на этой
    # странице — на любой). В проде (собранный бандл) под этот лимит почти
    # никогда не попадают, так что запас тут ничему не вредит.
    limit_req_zone $binary_remote_addr zone=static:10m rate=40r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    limit_req_status 429;
    limit_conn_status 429;

    # slowloris protection
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    large_client_header_buffers 4 16k;

    server {
        listen 80;

        # Product photos: backend serves them via useStaticAssets under
        # /uploads/, reached through the /api/ prefix (see useProducts.ts /
        # photoVariantUrl). Matched before /api/ since it's a longer prefix.
        location /api/uploads/ {
            limit_req zone=images burst=120 nodelay;
            limit_conn addr 60;

            proxy_pass http://backend/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /api/products -> backend's /products (prefix stripped)
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_conn addr 30;

            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Nuxt/Vite JS-модули в dev-режиме — см. комментарий у zone=static
        # выше. Matched before /, тот же принцип, что и /api/uploads/ vs /api/.
        location /_nuxt/ {
            limit_req zone=static burst=400 nodelay;
            limit_conn addr 60;

            proxy_pass http://frontend/_nuxt/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # everything else -> Nuxt (SSR + HMR websocket in dev)
        location / {
            limit_req zone=general burst=60 nodelay;
            limit_conn addr 30;

            proxy_pass http://frontend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
