# Base topology, shared by dev and prod: backend + frontend + nginx, all
# internal except nginx. Prod runs this file alone; dev layers
# docker-compose.dev.yml on top (build target + hot-reload volumes only —
# the services/network/exposed-port shape stays identical).
services:
  backend:
    build:
      context: ./backend
      target: prod
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://kiyim:kiyim@postgres:5432/kiyim?schema=public}
      PORT: 3001
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8088}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ALLOWED_PHONES: ${ALLOWED_PHONES:-}
      SELLER_PROFILES: ${SELLER_PROFILES:-}
      BOT_ADMIN_SELLER_SLUGS: ${BOT_ADMIN_SELLER_SLUGS:-}
      MIR_JEANS_INGEST_TOKEN: ${MIR_JEANS_INGEST_TOKEN:-}
    # Нужно для локального теста интеграции с "Мир Джинс": её вебхук шлёт
    # ссылки на фото вида http://host.docker.internal:<порт> (см. её
    # KIYIM_PUBLIC_BASE_URL), а backend их скачивает при upsert — без этой
    # записи хост не резолвится в контейнере на Linux (на Mac/Windows Docker
    # добавляет её сам). Не мешает проду: там ссылки — обычный публичный
    # домен, host.docker.internal просто не используется.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-uploads:/app/uploads
      # Ключи поставщиков (config/suppliers-clients.json, см.
      # src/integrations/suppliers) — редактируются вручную прямо на
      # хосте/сервере, без пересборки образа. Файл в .gitignore, в
      # репозитории только .example рядом.
      - ./backend/config:/app/config:ro
    networks:
      - kiyim-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_API_BASE_SERVER: http://backend:3001
    depends_on:
      - backend
    networks:
      - kiyim-network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - kiyim-network
    restart: unless-stopped

volumes:
  backend-uploads:

networks:
  kiyim-network:
    external: true
    name: kiyim-network
